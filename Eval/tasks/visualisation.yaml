- id: vis-001-studio-setup-shoulder-line
  discipline: visualisation
  mode: computer_use
  tools:
  - vred
  - blender
  difficulty: 3
  prompt: 'Light the supplied vehicle so the shoulder line reads as one crisp highlight from front-3/4,
    key from camera-left, with a visible ground contact shadow and no clipped highlights >0.5%.

    '
  inputs:
    file: assets/vehicle_studio.vpb
  checks:
  - name: key_from_left
    grader: render.key_light_direction
    weight: 0.25
  - name: contact_shadow
    grader: render.ground_shadow_present
    weight: 0.15
  - name: clipping
    grader: render.clipped_fraction
    weight: 0.2
  - name: highlight_continuity_vlm
    grader: vlm_rubric
    weight: 0.4
- id: vis-002-rig-door-opening
  discipline: visualisation
  mode: computer_use
  tools:
  - blender
  difficulty: 4
  prompt: 'Rig Door_L: hinge at the A-pillar (location (0.97, 0.85, 0.8) m, rotation about world Z), Limit
    Rotation constraint 0-70 degrees, and keyframe rotation_euler Z from 0 to 70 degrees over exactly
    2 s (scene fps). The door must not intersect any other mesh on any frame.'
  inputs:
    file: car_unrigged.blend (generated)
    door: Door_L
  checks:
  - name: hinge_axis_error_deg
    grader: scene_state.hinge_axis_error
    weight: 0.3
    params:
      object: Door_L
      axis: 2
      target_axis:
      - 0
      - 0
      - 1
      hinge_point:
      - 0.97
      - 0.85
      - 0.8
      tol_deg: 1.0
      tol_m: 0.01
  - name: rotation_limits
    grader: scene_state.rotation_limits
    weight: 0.2
    params:
      object: Door_L
      axis: 2
      min_deg: 0
      max_deg: 70
  - name: no_intersection_all_frames
    grader: scene_state.no_intersection_all_frames
    weight: 0.3
    params:
      object: Door_L
  - name: duration_2s
    grader: scene_state.duration
    weight: 0.2
    params:
      object: Door_L
      axis: 2
      seconds: 2
      max_deg: 70
